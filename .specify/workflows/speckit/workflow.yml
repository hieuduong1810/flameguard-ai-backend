schema_version: "1.0"
workflow:
  id: "speckit"
  name: "FlameGuard gated SDD cycle"
  version: "1.0.2"
  author: "FlameGuard AI Backend (adapted from GitHub Spec Kit)"
  description: "Specify, clarify when needed, plan, tasks, analyze, implement, test and converge with evidence gates"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The four commands below (specify, plan, tasks, implement) are core
    # spec-kit commands provided by every integration. The list here is an
    # advisory, non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema -- it is NOT a closed set. The workflow runs
    # against any integration the project was initialized with, including
    # ones not listed below, as long as that integration provides the four
    # core commands referenced in ``steps``.
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  # These manual gates are deliberate: they require recorded evidence in Codex chat.
  # They do not claim to execute arbitrary shell checks or additional skill commands.
  - id: clarify
    type: gate
    message: "Compare the spec with existing ERD/contracts. Run $speckit-clarify in Codex chat when needed. Approve only with resolved material questions or a recorded no-clarification rationale; otherwise reject."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    type: gate
    message: "Run $speckit-analyze in Codex chat against spec, plan, tasks and Constitution. Record findings and dispositions. Approve only when no unresolved violation or material blocker affects the implementation slice; otherwise reject and revise artifacts."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: test
    type: gate
    message: "Execute relevant Poetry lint/format/tests and tooling checks. Record exact commands, results, counts and skips in feature verification artifacts. Use only approved isolated DB targets. Approve only when required checks pass; otherwise reject and return to tasks/implementation."
    options: [approve, reject]
    on_reject: abort

  - id: converge
    type: gate
    message: "Run $speckit-converge in Codex chat. Map every acceptance criterion to executed evidence, review diff/secrets/ownership and Definition of Done. Approve only with no actionable gap; otherwise reject, add remediation tasks and repeat implementation/verification. Commit, push and deployment still require applicable authorization."
    options: [approve, reject]
    on_reject: abort
